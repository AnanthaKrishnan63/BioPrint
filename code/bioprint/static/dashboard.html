<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioPrint — live confidence dashboard</title>
<meta name="description" content="Live view of login attempts: typing rhythm, pointer, bot and device signals against their limits, kept separate, and why each attempt was allowed or blocked.">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='19' font-size='20'>📊</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <path d="M12 3c2.5 0 4.7 1.2 6 3M4 8.5C5.3 5.8 8.4 4 12 4M6.5 19.5c-.9-1.8-1.3-3.6-1.3-5.5 0-3.3 3-6 6.8-6s6.8 2.7 6.8 6c0 1.2-.1 2.3-.4 3.4M9 20.4c-.6-1.6-1-3.4-1-6 0-2.2 1.8-4 4-4s4 1.8 4 4c0 2.6-.4 4.7-1.2 6.6M12 12.4v3.2c0 1.6.2 3.2.7 4.7"/>
    </svg>
    BioPrint <small>live confidence dashboard</small>
  </a>
  <nav class="demo-nav" aria-label="Demo">
    <span class="label" aria-hidden="true">Demo</span>
    <a href="./index.html#login" data-page="login">Sign in</a>
    <a href="./index.html#enroll" data-page="enroll">Create account</a>
    <a href="./dashboard.html" data-page="dashboard">Dashboard</a>
  </nav>
</header>

<main class="dash-main">
  <div class="dash-controls">
    <div class="field">
      <label for="user">Account</label>
      <input id="user" type="text" placeholder="all accounts" autocomplete="off" spellcheck="false">
    </div>
    <button class="btn btn-ghost" id="follow" type="button" aria-pressed="true">Follow latest</button>
    <button class="btn btn-ghost" id="pause" type="button" aria-pressed="false">Pause</button>
    <span class="live" id="live"><span class="beat" aria-hidden="true"></span><span id="live-text">polling every 2s</span></span>
  </div>

  <section class="panel hero" id="hero" aria-label="Selected attempt">
    <div class="verdict" id="verdict"></div>
    <div class="signals" id="signals"></div>
  </section>

  <div class="row2">
    <section class="panel">
      <h2>Score against its limit, attempt by attempt</h2>
      <div class="chart-legend" id="legend"></div>
      <div class="chart-wrap" id="chart-wrap">
        <div class="tip" id="tip" hidden></div>
      </div>
    </section>

    <section class="panel">
      <h2>Recent attempts <span id="count" class="gauge-val"></span></h2>
      <div id="table-wrap"></div>
    </section>
  </div>
</main>

<script type="module" src="./dashboard.js"></script>
</body>
</html>
